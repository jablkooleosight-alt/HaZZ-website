<style>
/* ==========================================================================
   Tokeny & Témata (Tmavý / Světlý Režim)
   ========================================================================== */
:root {
  --bg: #12151b;
  --panel: #191d25;
  --panel-2: #1f242e;
  --line: #2b313d;
  --text: #e9ebef;
  --muted: #8d95a4;
  --red: #e63b2e;
  --red-dim: #3a1c1d;
  --amber: #f2a53a;
  --amber-dim: #3b2d17;
  --blue: #5aa0d6;
  --green: #4cb782;
  --grey: #7c8494;
  --radius: 6px;
  --f-head: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
}

body.light-theme {
  --bg: #f4f5f8;
  --panel: #ffffff;
  --panel-2: #e9ecef;
  --line: #d1d5db;
  --text: #1f2937;
  --muted: #6b7280;
  --red-dim: #fde8e8;
  --amber-dim: #fef3c7;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { color-scheme: dark; }
body { background: var(--bg); color: var(--text); font-family: var(--f-body); font-size: 15px; line-height: 1.5; min-height: 100vh; transition: background 0.2s, color 0.2s; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-head); font-weight: 600; letter-spacing: 0.01em; line-height: 1.1; }
h1 { font-size: 2.1rem; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.1rem; }
.muted { color: var(--muted); }

/* ==========================================================================
   Layout
   ========================================================================== */
.app { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
.side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 20px 14px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 22px; }
.brand-mark { width: 38px; height: 38px; border-radius: 8px; background: var(--red); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 22px; height: 22px; fill: #fff; }
.brand b { font-family: var(--f-head); font-size: 1.25rem; font-weight: 700; display: block; line-height: 1; }
.brand span { font-size: 0.78rem; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius); color: var(--muted); text-decoration: none; font-weight: 500; border-left: 3px solid transparent; }
.nav a svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.nav a:hover { background: var(--panel-2); color: var(--text); }
.nav a.on { background: var(--panel-2); color: var(--text); border-left-color: var(--red); }
.nav .badge { margin-left: auto; background: var(--amber); color: #1a1200; font-size: 0.72rem; font-weight: 700; border-radius: 20px; padding: 0 7px; min-width: 20px; text-align: center; }
.side-foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.me { display: flex; align-items: center; gap: 10px; padding: 4px 6px; }
.me-name { font-weight: 600; line-height: 1.2; }
.me-rank { font-size: 0.8rem; color: var(--muted); }
.main { padding: 32px clamp(18px, 4vw, 44px) 60px; max-width: 1200px; width: 100%; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.page-head p { color: var(--muted); margin-top: 6px; }

.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-head); font-weight: 700; font-size: 1rem; color: #fff; flex: none; }
.avatar.lg { width: 56px; height: 56px; font-size: 1.5rem; }

/* ==========================================================================
   Komponenty
   ========================================================================== */
.btn { display: inline-flex; align-items: center; gap: 8px; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 14px; font-weight: 500; transition: background 0.15s, border-color 0.15s; }
.btn:hover { background: var(--line); }
.btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
.btn.primary:hover { background: #f04a3d; }
.btn.danger { color: #ff8b82; }
.btn.danger:hover { background: var(--red-dim); border-color: var(--red); }
.btn.ok { color: var(--green); }
.btn.sm { padding: 4px 10px; font-size: 0.85rem; }
.btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 20px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); gap: 12px; }
.panel-body { padding: 18px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 20px; }

.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 20px; }
.strip > div { padding: 16px 20px; border-right: 1px solid var(--line); }
.strip > div:last-child { border-right: 0; }
.strip .n { font-family: var(--f-head); font-size: 2.2rem; font-weight: 700; line-height: 1; }
.strip .l { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
.strip .warn .n { color: var(--amber); }

.tag { display: inline-block; padding: 1px 9px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; border: 1px solid var(--line); color: var(--muted); }
.tag.pending { color: var(--amber); border-color: #5a4520; background: var(--amber-dim); }
.tag.approved { color: var(--green); border-color: #25523d; }
.tag.lead { color: #ffb4ae; border-color: #6a2b2b; background: var(--red-dim); }

.inc-list { list-style: none; }
.inc { display: grid; grid-template-columns: 5px 1fr auto; gap: 14px; padding: 13px 18px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: center; background: none; width: 100%; text-align: left; border-left: 0; border-right: 0; border-top: 0; }
.inc:last-child { border-bottom: 0; }
.inc:hover { background: var(--panel-2); }
.inc .bar { align-self: stretch; border-radius: 3px; }
.inc .no { font-family: var(--f-head); font-weight: 600; font-size: 1.05rem; letter-spacing: 0.02em; }
.inc .sub { color: var(--muted); font-size: 0.87rem; }
.inc .right { text-align: right; font-size: 0.85rem; color: var(--muted); }
.t-pozar { background: var(--red); }
.t-dn { background: var(--amber); }
.t-technika { background: var(--blue); }
.t-zachrana { background: var(--green); }
.t-plany { background: var(--grey); }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label, .field .lab { font-size: 0.85rem; color: var(--muted); font-weight: 500; }
input[type=text], input[type=search], input[type=datetime-local], select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 11px; width: 100%; }
input:focus, select:focus, textarea:focus { border-color: var(--amber); outline: none; }
textarea { min-height: 90px; resize: vertical; }
.toolbar input, .toolbar select { width: auto; min-width: 160px; }
.toolbar input[type=search] { flex: 1; min-width: 200px; }

table { width: 100%; border-collapse: collapse; }
th { font-weight: 600; font-size: 0.85rem; color: var(--muted); text-align: left; padding: 10px 18px; border-bottom: 1px solid var(--line); }
td { padding: 11px 18px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover { background: var(--panel-2); }
.who { display: flex; align-items: center; gap: 11px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--line); margin-right: 7px; }
.dot.on { background: var(--green); box-shadow: 0 0 0 3px #4cb78233; }
.table-wrap { overflow-x: auto; }

.note { padding: 14px 18px; border-bottom: 1px solid var(--line); }
.note:last-child { border-bottom: 0; }
.note.important { border-left: 3px solid var(--amber); background: linear-gradient(90deg, var(--amber-dim), transparent 60%); }
.empty { padding: 28px 18px; text-align: center; color: var(--muted); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; flex-wrap: wrap; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 16px; color: var(--muted); font-weight: 500; margin-bottom: -1px; }
.tabs button.on { color: var(--text); border-bottom-color: var(--red); }
.tabs .badge { background: var(--amber); color: #1a1200; border-radius: 20px; font-size: 0.72rem; font-weight: 700; padding: 0 7px; margin-left: 6px; }

.dl { display: grid; grid-template-columns: 140px 1fr; gap: 8px 16px; }
.dl dt { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--panel-2); border: 1px solid var(--line); border-radius: 20px; padding: 2px 11px; font-size: 0.87rem; }

/* Modal */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: grid; place-items: center; padding: 16px; z-index: 50; overflow-y: auto; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; width: min(680px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; animation: pop 0.15s ease-out; }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 22px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
.modal-body { padding: 22px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 22px; border-top: 1px solid var(--line); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-grid .full { grid-column: 1 / -1; }
.check-box { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; max-height: 170px; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; background: var(--bg); }
.check-box label { display: flex; align-items: center; gap: 8px; font-size: 0.92rem; color: var(--text); font-weight: 400; cursor: pointer; }
@keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* Toast */
.toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 100; }
.toast { background: var(--panel-2); border: 1px solid var(--line); border-left: 4px solid var(--green); border-radius: var(--radius); padding: 10px 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); animation: pop 0.2s ease-out; }
.toast.err { border-left-color: var(--red); }

/* Přihlášení */
.login { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: var(--bg); }
.login-card { width: min(480px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.login-top { padding: 30px 30px 22px; border-bottom: 1px solid var(--line); }
.login-top .brand { padding: 0 0 18px; }
.login-top h1 { font-size: 2.4rem; }
.login-top p { color: var(--muted); margin-top: 8px; }
.login-body { padding: 22px 30px 28px; }
.demo-user { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 12px; margin-bottom: 8px; }
.demo-user:hover { border-color: var(--amber); }
.demo-user .role { margin-left: auto; font-size: 0.78rem; color: var(--muted); text-align: right; }
.clock { font-family: var(--f-head); font-size: 1.9rem; font-weight: 600; text-align: right; line-height: 1; }
.clock small { display: block; font-family: var(--f-body); font-size: 0.8rem; color: var(--muted); font-weight: 400; margin-top: 4px; }
</style>
</head>

      { id: 'i1', number: 'VYJ-2026-0001', datetime: new Date().toISOString(), type: 'pozar', location: 'Lipová 12', units: ['CAS 20'], memberIds: ['m1', 'm3'], commanderId: 'm1', description: 'Požár v kuchyni.', result: 'Uhašeno', status: 'approved', authorId: 'm1' }

    ],
    monthlyResetDate: new Date().toISOString()
  };
}

let DB = (() => { try { const r = localStorage.getItem(STORE_KEY); if (r) return JSON.parse(r); } catch {} return seed(); })();
const persist = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch {} };

const Data = {
  members: () => DB.members,
  member: id => DB.members.find(m => m.id === id),
  incidents: () => DB.incidents,
  guidelines: () => DB.guidelines,
  divisions: () => DB.divisions,
  saveIncident(inc) {
    const idx = DB.incidents.findIndex(x => x.id === inc.id);
    if (idx >= 0) DB.incidents[idx] = inc; else DB.incidents.push(inc);
    persist();
  },
  saveMember(m) {
    const idx = DB.members.findIndex(x => x.id === m.id);
    if (idx >= 0) DB.members[idx] = m; else DB.members.push(m);
    persist();
  },
  saveGuideline(g) {
    const idx = DB.guidelines.findIndex(x => x.id === g.id);
    if (idx >= 0) DB.guidelines[idx] = g; else DB.guidelines.push(g);
    persist();
  },
  saveDivision(d) {
    const idx = DB.divisions.findIndex(x => x.id === d.id);
    if (idx >= 0) DB.divisions[idx] = d; else DB.divisions.push(d);
    persist();
  },
  resetMonthlyStats() {
    DB.monthlyResetDate = new Date().toISOString();

};

};

        <a href="#/incidents" class="${state.activeTab==='incidents'?'on':''}">Výjezdy</a>
        <a href="#/guidelines" class="${state.activeTab==='guidelines'?'on':''}">Směrnice</a>
        <a href="#/divisions" class="${state.activeTab==='divisions'?'on':''}">Divize</a>
        <a href="#/members" class="${state.activeTab==='members'?'on':''}">Členové</a>
        ${isLead(u) ? `<a href="#/admin" class="${state.activeTab==='admin'?'on':''}">Vedení <span class="badge">${Data.incidents().filter(i=>i.status==='pending').length}</span></a>` : ''}
      </nav>
      <div class="side-foot">
        <button class="btn sm" data-act="toggle-theme">Režim: ${state.theme === 'dark' ? '🌙 Tmavý' : '☀️ Světlý'}</button>
        <div class="me">${avatar(u)}<div><div class="me-name">${esc(u.name)}</div><div class="me-rank">${esc(rankOf(u.rank).name)}</div></div></div>
        <button class="btn sm danger" data-act="logout">Odhlásit se</button>
      </div>
    </aside>
    <main class="main" id="view"></main>
  </div>`;
  renderView();
}

function renderView() {
  const v = state.activeTab;
  const el = $('#view');
  if (v === 'dashboard') el.innerHTML = viewDashboard();
  else if (v === 'incidents') el.innerHTML = viewIncidents();
  else if (v === 'guidelines') el.innerHTML = viewGuidelines();
  else if (v === 'divisions') el.innerHTML = viewDivisions();
  else if (v === 'members') el.innerHTML = viewMembers();
  else if (v === 'admin' && isLead(state.user)) el.innerHTML = viewAdmin();
  else el.innerHTML = viewDashboard();
}

/* ---------- Přehled ---------- */
function viewDashboard() {
  const u = state.user;
  
  // Výjezdy: Vedení vidí vše, běžný člen jen své
  const myIncidents = Data.incidents().filter(i => isLead(u) || i.memberIds.includes(u.id));
  const approvedInc = myIncidents.filter(i => i.status === 'approved');

  // Výpočet prémií (1000 € za výjezd, 1500 € pro velitele)
  let bonus = 0;
  approvedInc.forEach(i => {
    if (i.commanderId === u.id) bonus += 1500;
    else if (i.memberIds.includes(u.id)) bonus += 1000;
  });

  // Čas ve službě
  const totalMin = Math.floor((u.totalDutySeconds || 0) / 60);
  const hours = Math.floor(totalMin / 60);
  const mins = totalMin % 60;

  return `
  <div class="page-head">
    <div><h1>Vítej, ${esc(u.name)}</h1><p>Hodnost: ${esc(rankOf(u.rank).name)}</p></div>
    <div>
      <button class="btn ${u.onDuty?'danger':'primary'}" data-act="toggle-duty">
        ${u.onDuty ? 'Ukončit službu (Aktivní)' : 'Nastoupit do služby'}
      </button>
    </div>
  </div>

  <div class="strip">
    <div><div class="n">${approvedInc.length}</div><div class="l">Moje výjezdy</div></div>
    <div><div class="n">${bonus.toLocaleString()} €</div><div class="l">Moje Prémie za výjezdy</div></div>
    <div><div class="n">${hours}h ${mins}m</div><div class="l">Odsloužený čas</div></div>
  </div>

  ${isInnerLead(u) ? `
  <div class="panel">
    <div class="panel-head">
      <h2>Statistika výjezdů za 30 dní (Užší Vedení)</h2>
      <button class="btn sm danger" data-act="reset-stats">Resetovat měsíční statistiku</button>
    </div>
    <div class="panel-body">
      <p class="muted">Od posledního resetu (${fmtDate(DB.monthlyResetDate || new Date())}) bylo zaznamenáno <b>${Data.incidents().length}</b> výjezdů.</p>
    </div>
  </div>` : ''}

  <div class="panel">
    <div class="panel-head"><h2>Poslední dostupné výjezdy</h2><button class="btn primary sm" data-act="new-incident">Zapsat výjezd</button></div>
    <ul class="inc-list">
      ${myIncidents.slice(0, 5).map(i => `
        <li class="inc" data-act="open-incident" data-id="${i.id}">
          <span class="bar ${TYPES[i.type]?.cls || ''}"></span>
          <span><b>${esc(i.number)}</b> -${esc(i.location)}</span>
          <span class="right">${fmtDT(i.datetime)}</span>
        </li>`).join('') || '<li class="empty">Žádné dostupné výjezdy.</li>'}
    </ul>
  </div>`;
}

/* ---------- Výjezdy ---------- */
function viewIncidents() {
  const u = state.user;
  const list = Data.incidents().filter(i => isLead(u) || i.memberIds.includes(u.id));

  return `
  <div class="page-head">
    <div><h1>Výjezdy</h1><p>${isLead(u) ? 'Všechny výjezdy jednotky' : 'Moje výjezdy'}</p></div>
    <button class="btn primary" data-act="new-incident">Zapsat výjezd</button>
  </div>
  <div class="panel">
    <ul class="inc-list">
      ${list.map(i => `
        <li class="inc" data-act="open-incident" data-id="${i.id}">
          <span class="bar ${TYPES[i.type]?.cls || ''}"></span>
          <span><b>${esc(i.number)}</b> (${TYPES[i.type]?.name}) -${esc(i.location)}</span>
          <span class="right">${i.status === 'pending' ? '<span class="tag pending">Čeká</span>' : '<span class="tag approved">Schváleno</span>'}</span>
        </li>`).join('') || '<li class="empty">Žádné výjezdy.</li>'}
    </ul>
  </div>`;
}

/* ---------- Směrnice ---------- */
function viewGuidelines() {
  const u = state.user;
  return `
  <div class="page-head">
    <div><h1>Směrnice & Předpisy</h1><p>Platné postupy pro zásahy</p></div>
    ${isDirector(u) ? '<button class="btn primary" data-act="new-guideline">Přidat směrnici</button>' : ''}
  </div>
  <div class="stack">
    ${Data.guidelines().map(g => `
      <div class="panel"><div class="panel-head"><h2>${esc(g.title)}</h2><span class="tag">${esc(g.category)}</span></div>
      <div class="panel-body"><p>${esc(g.content)}</p></div></div>
    `).join('') || '<div class="empty">Žádné směrnice.</div>'}
  </div>`;
}

/* ---------- Divize ---------- */
function viewDivisions() {
  const u = state.user;
  return `
  <div class="page-head">
    <div><h1>Divize & Rozdělení</h1><p>Přehled divizí a jejich velitelů</p></div>
    ${isDirector(u) ? '<button class="btn primary" data-act="new-division">Vytvořit divizi</button>' : ''}
  </div>
  <div class="grid-2">
    ${Data.divisions().map(d => {
      const cmd = Data.member(d.commanderId);
      return `
      <div class="panel">
        <div class="panel-head"><h2>${esc(d.name)}</h2></div>
        <div class="panel-body">
          <p><b>Velitel divize:</b> ${cmd ? esc(cmd.name) : 'Nepřiřazen'}</p>
          <p class="muted">${esc(d.description)}</p>
        </div>
      </div>`;
    }).join('') || '<div class="empty">Žádné divize.</div>'}
  </div>`;
}

/* ---------- Členové ---------- */
function viewMembers() {
  return `
  <div class="page-head"><div><h1>Seznam Členů</h1></div></div>
  <div class="panel"><div class="table-wrap"><table>
    <thead><tr><th>Člen</th><th>Hodnost</th><th>Služební číslo</th><th>Odslouženo</th></tr></thead>
    <tbody>
      ${Data.members().map(m => `
        <tr>
          <td><div class="who">${avatar(m)}<b>${esc(m.name)}</b></div></td>
          <td>${esc(rankOf(m.rank).name)}</td>
          <td>${esc(m.number)}</td>
          <td>${Math.floor((m.totalDutySeconds||0)/3600)} hod.</td>
        </tr>`).join('')}
    </tbody>
  </table></div></div>`;
}

/* ---------- Vedení ---------- */
function viewAdmin() {
  const pending = Data.incidents().filter(i => i.status === 'pending');
  return `
  <div class="page-head"><div><h1>Správa Vedení</h1></div></div>
  <div class="panel">
    <div class="panel-head"><h2>Výjezdy ke schválení (${pending.length})</h2></div>
    <ul class="inc-list">
      ${pending.map(i => `
        <li class="inc">
          <span><b>${esc(i.number)}</b> -${esc(i.location)}</span>
          <span>
            <button class="btn sm ok" data-act="approve-inc" data-id="${i.id}">Schválit</button>
          </span>
        </li>`).join('') || '<li class="empty">Žádné výjezdy nečekají na schválení.</li>'}
    </ul>
  </div>`;
}

/* ==========================================================================
   Modální okna
   ========================================================================== */
function closeModal() { $('#overlay')?.remove(); }

function openNewIncidentModal() {
  const u = state.user;
  const members = Data.members();
  const html = `
  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="modal-head"><h2>Zapsat nový výjezd</h2></div>
      <div class="modal-body">
        <form id="inc-form" class="form-grid">
          <div class="field"><label>Místo zásahu</label><input type="text" id="i-loc" required></div>
          <div class="field"><label>Typ události</label>
            <select id="i-type">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('')}</select>
          </div>
          <div class="field full"><label>Zasahující členové</label>
            <div class="check-box">
              ${members.map(m=>`<label><input type="checkbox" name="m-check" value="${m.id}"> ${esc(m.name)}</label>`).join('')}
            </div>
          </div>
          <div class="field full"><label>Popis</label><textarea id="i-desc" required></textarea></div>
        </form>
      </div>
      <div class="modal-foot">
        <button class="btn" data-act="close">Zrušit</button>
        <button class="btn primary" data-act="submit-inc">Uložit a Odeslat</button>
      </div>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}

/* ==========================================================================
   Akce a Eventy
   ========================================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  if (act === 'login') {
    state.user = Data.member(el.dataset.id);
    renderApp();
    toast(`Přihlášen jako ${state.user.name}`);
  }
  if (act === 'logout') { state.user = null; renderLogin(); }
  if (act === 'toggle-theme') {
    document.body.classList.toggle('light-theme');
    localStorage.setItem('theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
    renderApp();
  }
  if (act === 'toggle-duty') {
    const u = state.user;
    u.onDuty = !u.onDuty;
    if (u.onDuty) {
      u.dutyStart = Date.now();
      toast('Nastoupil jsi do služby.');
    } else {
      if (u.dutyStart) {
        const diff = Math.floor((Date.now() - u.dutyStart) / 1000);
        u.totalDutySeconds = (u.totalDutySeconds || 0) + diff;
        u.dutyStart = null;
      }
      toast('Služba ukončena.');
    }
    Data.saveMember(u);

    // Odeslání na Discord Webhook
    sendDiscordWebhook(CONFIG.WEBHOOK_DUTY_LOG, {
      embeds: [{
        title: u.onDuty ? '🟢 Nástup do služby' : '🔴 Odchod ze služby',
        description: `Hasič **${u.name}** (${rankOf(u.rank).name}) ${u.onDuty ? 'nastoupil do služby' : 'ukončil službu'}.`,
        color: u.onDuty ? 3066993 : 15158332
      }]
    });

    renderApp();
  }
  if (act === 'new-incident') openNewIncidentModal();
  if (act === 'close') closeModal();
  if (act === 'submit-inc') {
    const loc = $('#i-loc').value;
    const desc = $('#i-desc').value;
    const type = $('#i-type').value;
    const selectedMembers = Array.from(document.querySelectorAll('input[name="m-check"]:checked')).map(cb => cb.value);

    if (!loc || !desc) return toast('Vyplň všechna pole.', true);

    const inc = {
      id: uid(),
      number: `VYJ-2026-000${Data.incidents().length + 1}`,
      datetime: new Date().toISOString(),
      type, location: loc,
      units: ['CAS 20'],
      memberIds: selectedMembers.length ? selectedMembers : [state.user.id],
      commanderId: state.user.id,
      description: desc,
      result: 'V řešení',
      status: isLead(state.user) ? 'approved' : 'pending',
      authorId: state.user.id
    };

    Data.saveIncident(inc);
    closeModal();

    // Send Discord Webhook Notice
    if (inc.status === 'pending') {
      sendDiscordWebhook(CONFIG.WEBHOOK_INCIDENTS_PENDING, {
        embeds: [{
          title: '🚨 Nový výjezd ke schválení!',
          description: `**Číslo:** ${inc.number}\n**Místo:** ${inc.location}\n**Zapsal:** ${state.user.name}`,
          color: 15844367
        }]
      });
      toast('Výjezd uložen a odebrán ke schválení vedení.');
    } else {
      toast('Výjezd uložen.');
    }

    renderApp();
  }
  if (act === 'approve-inc') {
    const inc = Data.incidents().find(i => i.id === el.dataset.id);
    if (inc) {
      inc.status = 'approved';
      Data.saveIncident(inc);
      toast('Výjezd schválen.');
      renderApp();
    }
  }
  if (act === 'reset-stats') {
    if (confirm('Opravdu chcete resetovat měsíční statistiku na nulu?')) {
      Data.resetMonthlyStats();
      toast('Statistika byla resetována.');
      renderApp();
    }
  }
});

window.addEventListener('hashchange', () => {
  const hash = location.hash.replace('#/', '');
  if (hash) state.activeTab = hash;
  renderApp();
});

init();
</script>
</body>
</html>
