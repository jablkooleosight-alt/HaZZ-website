<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HZS – Výjezdový a Informační systém</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #12151b;
      --panel: #191d25;
      --panel-2: #1f242e;
      --line: #2b313d;
      --text: #e9ebef;
      --muted: #8d95a4;
      --red: #e63b2e;
      --red-dim: #3a1c1d;
      --amber: #f2a53a;
      --amber-dim: #3b2d17;
      --blue: #5aa0d6;
      --green: #4cb782;
      --grey: #7c8494;
      --radius: 6px;
      --f-head: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
      --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
    }

    body.light-theme {
      --bg: #f4f5f8;
      --panel: #ffffff;
      --panel-2: #e9ecef;
      --line: #d1d5db;
      --text: #1f2937;
      --muted: #6b7280;
      --red-dim: #fde8e8;
      --amber-dim: #fef3c7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; }
    body { background: var(--bg); color: var(--text); font-family: var(--f-body); font-size: 15px; line-height: 1.5; min-height: 100vh; transition: background 0.2s, color 0.2s; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
    h1, h2, h3 { font-family: var(--f-head); font-weight: 600; letter-spacing: 0.01em; line-height: 1.1; }
    h1 { font-size: 2.1rem; }
    h2 { font-size: 1.35rem; }
    .muted { color: var(--muted); }

    .app { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
    .side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 20px 14px; position: sticky; top: 0; height: 100vh; }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 22px; }
    .brand-mark { width: 38px; height: 38px; border-radius: 8px; background: var(--red); display: grid; place-items: center; flex: none; }
    .brand-mark svg { width: 22px; height: 22px; fill: #fff; }
    .brand b { font-family: var(--f-head); font-size: 1.25rem; font-weight: 700; display: block; line-height: 1; }
    .brand span { font-size: 0.78rem; color: var(--muted); }
    .nav { display: flex; flex-direction: column; gap: 2px; }
    .nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius); color: var(--muted); text-decoration: none; font-weight: 500; border-left: 3px solid transparent; }
    .nav a:hover { background: var(--panel-2); color: var(--text); }
    .nav a.on { background: var(--panel-2); color: var(--text); border-left-color: var(--red); }
    .nav .badge { margin-left: auto; background: var(--amber); color: #1a1200; font-size: 0.72rem; font-weight: 700; border-radius: 20px; padding: 0 7px; min-width: 20px; text-align: center; }
    .side-foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
    .me { display: flex; align-items: center; gap: 10px; padding: 4px 6px; }
    .me-name { font-weight: 600; line-height: 1.2; }
    .me-rank { font-size: 0.8rem; color: var(--muted); }
    .main { padding: 32px clamp(18px, 4vw, 44px) 60px; max-width: 1200px; width: 100%; }
    .page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .page-head p { color: var(--muted); margin-top: 6px; }

    .avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-head); font-weight: 700; font-size: 1rem; color: #fff; flex: none; background-size: cover; background-position: center; }

    .btn { display: inline-flex; align-items: center; gap: 8px; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 14px; font-weight: 500; transition: background 0.15s, border-color 0.15s; text-decoration: none; }
    .btn:hover { background: var(--line); }
    .btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
    .btn.primary:hover { background: #f04a3d; }
    .btn.discord { background: #5865F2; border-color: #5865F2; color: #fff; }
    .btn.discord:hover { background: #4752C4; }
    .btn.danger { color: #ff8b82; }
    .btn.danger:hover { background: var(--red-dim); border-color: var(--red); }
    .btn.ok { color: var(--green); }
    .btn.sm { padding: 4px 10px; font-size: 0.85rem; }

    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 20px; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); gap: 12px; }
    .panel-body { padding: 18px; }

    .strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 20px; }
    .strip > div { padding: 16px 20px; border-right: 1px solid var(--line); }
    .strip > div:last-child { border-right: 0; }
    .strip .n { font-family: var(--f-head); font-size: 2.2rem; font-weight: 700; line-height: 1; }
    .strip .l { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

    .tag { display: inline-block; padding: 1px 9px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; border: 1px solid var(--line); color: var(--muted); }
    .tag.pending { color: var(--amber); border-color: #5a4520; background: var(--amber-dim); }
    .tag.approved { color: var(--green); border-color: #25523d; }

    .inc-list { list-style: none; }
    .inc { display: grid; grid-template-columns: 5px 1fr auto; gap: 14px; padding: 13px 18px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: center; background: none; width: 100%; text-align: left; border-left: 0; border-right: 0; border-top: 0; }
    .inc:last-child { border-bottom: 0; }
    .inc:hover { background: var(--panel-2); }
    .inc .bar { align-self: stretch; border-radius: 3px; }
    .inc .right { text-align: right; font-size: 0.85rem; color: var(--muted); }
    .t-pozar { background: var(--red); }
    .t-dn { background: var(--amber); }
    .t-technika { background: var(--blue); }
    .t-zachrana { background: var(--green); }
    .t-plany { background: var(--grey); }

    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 0.85rem; color: var(--muted); font-weight: 500; }
    input[type=text], select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 11px; width: 100%; }
    input:focus, select:focus, textarea:focus { border-color: var(--amber); outline: none; }
    textarea { min-height: 90px; resize: vertical; }

    table { width: 100%; border-collapse: collapse; }
    th { font-weight: 600; font-size: 0.85rem; color: var(--muted); text-align: left; padding: 10px 18px; border-bottom: 1px solid var(--line); }
    td { padding: 11px 18px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    tr:last-child td { border-bottom: 0; }
    .who { display: flex; align-items: center; gap: 11px; }
    .table-wrap { overflow-x: auto; }
    .empty { padding: 28px 18px; text-align: center; color: var(--muted); }

    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: grid; place-items: center; padding: 16px; z-index: 50; overflow-y: auto; backdrop-filter: blur(3px); }
    .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: min(680px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.4); animation: pop 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
    .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
    .modal-body { padding: 24px; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--line); background: var(--panel); position: sticky; bottom: 0; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-grid .full { grid-column: 1 / -1; }
    .check-box { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; max-height: 170px; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; background: var(--bg); }
    .check-box label { display: flex; align-items: center; gap: 8px; font-size: 0.92rem; color: var(--text); font-weight: 400; cursor: pointer; }
    @keyframes pop { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: none; } }

    .toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 100; }
    .toast { background: var(--panel-2); border: 1px solid var(--line); border-left: 4px solid var(--green); border-radius: var(--radius); padding: 10px 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); animation: pop 0.2s ease-out; }
    .toast.err { border-left-color: var(--red); }

    .login { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: var(--bg); }
    .login-card { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; text-align: center; }
    .login-top { padding: 30px 30px 22px; border-bottom: 1px solid var(--line); }
    .login-top h1 { font-size: 2.2rem; }
    .login-top p { color: var(--muted); margin-top: 8px; }
    .login-body { padding: 28px 30px; display: flex; flex-direction: column; gap: 16px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div class="toasts" id="toasts"></div>

  <script>
  // <![CDATA[
  const CONFIG = {
    WEBHOOK_INCIDENTS_PENDING: "https://discord.com/api/webhooks/1551368968416268379/1Ivikd3AHmB4APopzy-ypMgMp56JzeTAvad0uYEgHH97Oo8MRlBs0RxJr6g9gRNvezpy",
    DISCORD_INVITE_LINK: "https://discord.gg/zqyEqGh7FC"
  };

  const RANKS = [
    { key: 'rotmajster', name: 'Rotmajster', level: 1 },
    { key: 'nadrotmajster', name: 'Nadrotmajster', level: 2 },
    { key: 'podpraporcik', name: 'Podpraporčík', level: 3 },
    { key: 'praporcik', name: 'Praporčík', level: 4 },
    { key: 'nadpraporcik', name: 'Nadpraporčík', level: 5 },
    { key: 'ppor', name: 'Podporučík', level: 6 },
    { key: 'por', name: 'Poručík', level: 7 },
    { key: 'npor', name: 'Nadporučík', level: 8 },
    { key: 'kpt', name: 'Kapitán', level: 9 },
    { key: 'mjr', name: 'Major', level: 10 },
    { key: 'pplk', name: 'Podplukovník', level: 11 },
    { key: 'plk', name: 'Plukovník', level: 12 },
    { key: 'reditelstvi', name: 'Ředitelství', level: 13 }
  ];

  const LEAD_LEVEL = 6;
  const INNER_LEAD_LEVEL = 9;
  const DIRECTOR_LEVEL = 10;
  const MAJOR_LEVEL = 10;

  const rankOf = key => RANKS.find(r => r.key === key) || RANKS[0];

  const TYPES = {
    pozar: { name: 'Požár', cls: 't-pozar' },
    dn: { name: 'Dopravní nehoda', cls: 't-dn' },
    technika: { name: 'Technická pomoc', cls: 't-technika' },
    zachrana: { name: 'Záchrana osob', cls: 't-zachrana' },
    plany: { name: 'Planý poplach', cls: 't-plany' }
  };

  const DIVISIONS = [
    "Horská služba",
    "chemicko-technická jednotka",
    "vyšetřovatel příčin požáru",
    "Urban search and rescue",
    "jednotka krizové intervence",
    "Akademie"
  ];

  const esc = str => String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = sel => document.querySelector(sel);
  const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('cs-CZ') : '-';
  const fmtDT = iso => {
    if (!iso) return '-';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '-';
    return `${d.toLocaleDateString('cs-CZ')} ${d.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' })}`;
  };
  const uid = () => Math.random().toString(36).slice(2, 10);
  const initials = name => (name || 'U N').split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();

  const avatar = m => {
    if (m && m.avatar) {
      return `<span class="avatar" style="background-image:url('${m.avatar}')"></span>`;
    }
    return `<span class="avatar" style="background:#8e44ad">${esc(initials(m ? m.name : ''))}</span>`;
  };

  const STORE_KEY = 'hzs_rp_v2_data';

  function seed() {
    return {
      members: [],
      incidents: [],
      guidelines: [
        { id: 'g1', title: 'SOP 01 - Postup u požáru', content: 'Vždy používejte dýchací přístroj a dodržujte zásady bezpečnosti.', category: 'Zásahy', date: new Date().toISOString() }
      ],
      announcements: [],
      divisions: [],
      weeklyBonusReset: new Date().toISOString()
    };
  }

  let DB = (() => {
    try {
      const r = localStorage.getItem(STORE_KEY);
      if (r) return JSON.parse(r);
    } catch (err) { console.error(err); }
    return seed();
  })();

  const persist = () => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch (e) {}
  };

  function checkWeeklyBonusReset() {
    const now = new Date();
    const lastReset = new Date(DB.weeklyBonusReset || now);
    const dayOfWeek = now.getDay();
    if (dayOfWeek === 1 && (now - lastReset) > 7 * 24 * 3600 * 1000) {
      DB.members.forEach(m => m.weeklyBonuses = {});
      DB.weeklyBonusReset = now.toISOString();
      persist();
    }
  }
  checkWeeklyBonusReset();

  const Data = {
    members: () => DB.members || [],
    member: id => DB.members.find(m => m.id === id) || null,
    incidents: () => DB.incidents || [],
    guidelines: () => DB.guidelines || [],
    announcements: () => DB.announcements || [],
    divisions: () => DB.divisions || [],
    
    async fetchIncidentsFromApi() {
      try {
        const res = await fetch('/api/incidents');
        if (res.ok) {
          const apiIncidents = await res.json();
          if (Array.isArray(apiIncidents) && apiIncidents.length > 0) {
            DB.incidents = apiIncidents;
            persist();
          }
        }
      } catch (e) {}
    },

    async saveIncidentApi(incData, isEdit = false) {
      try {
        const method = isEdit ? 'PATCH' : 'POST';
        const url = isEdit ? `/api/incidents/${incData.id}` : '/api/incidents';
        const res = await fetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(incData)
        });
        if (res.ok) {
          await Data.fetchIncidentsFromApi();
          return true;
        }
      } catch(e) {}
      return false;
    },

    async deleteIncidentApi(id) {
      try {
        const res = await fetch(`/api/incidents/${id}`, { method: 'DELETE' });
        if (res.ok) {
          await Data.fetchIncidentsFromApi();
          return true;
        }
      } catch(e) {}
      return false;
    },

    async saveIncident(inc) {
      const isNew = !DB.incidents.some(x => x.id === inc.id);
      await Data.saveIncidentApi(inc, !isNew);
      
      const idx = DB.incidents.findIndex(x => x.id === inc.id);
      if (idx >= 0) DB.incidents[idx] = inc;
      else {
        DB.incidents.unshift(inc);
        if (inc.memberIds) {
          inc.memberIds.forEach(mId => {
            const member = Data.member(mId);
            if (member) {
              if (!member.weeklyBonuses) member.weeklyBonuses = {};
              let bonus = 0;
              if (inc.type === 'pozar') {
                bonus = Math.floor(Math.random() * (1500 - 1200 + 1)) + 1200;
              } else {
                bonus = Math.floor(Math.random() * (1300 - 1000 + 1)) + 1000;
              }
              member.weeklyBonuses[inc.id] = bonus;
            }
          });
        }
      }
      persist();
    },
    async deleteIncident(id) {
      await Data.deleteIncidentApi(id);
      DB.incidents = DB.incidents.filter(x => x.id !== id);
      persist();
    },
    saveGuideline(g) {
      const idx = DB.guidelines.findIndex(x => x.id === g.id);
      if (idx >= 0) DB.guidelines[idx] = g;
      else DB.guidelines.push(g);
      persist();
    },
    deleteGuideline(id) {
      DB.guidelines = DB.guidelines.filter(x => x.id !== id);
      persist();
    },
    saveAnnouncement(a) {
      DB.announcements.unshift(a);
      persist();
    },
    saveMember(m) {
      const idx = DB.members.findIndex(x => x.id === m.id);
      if (idx >= 0) DB.members[idx] = m;
      else DB.members.push(m);
      persist();
    },
    deleteMember(id) {
      DB.members = DB.members.filter(x => x.id !== id);
      persist();
    },
    syncMembers(discordMembers) {
      if (!discordMembers || !discordMembers.length) return;
      DB.members = discordMembers.map(dm => {
        const existing = DB.members.find(m => m.id === dm.id);
        return {
          id: dm.id,
          name: existing ? existing.name : dm.name,
          rank: existing ? existing.rank : dm.rank,
          number: existing ? existing.number : dm.number,
          avatar: dm.avatar,
          joined: dm.joined,
          onDuty: existing ? existing.onDuty : false,
          dutyStart: existing ? existing.dutyStart : null,
          totalDutySeconds: existing ? existing.totalDutySeconds : 0,
          dutiesHistory: existing ? (existing.dutiesHistory || []) : [],
          weeklyBonuses: existing ? (existing.weeklyBonuses || {}) : {}
        };
      });
      persist();
    }
  };

  const state = {
    user: JSON.parse(sessionStorage.getItem('logged_user') || 'null'),
    activeTab: localStorage.getItem('active_tab') || 'dashboard',
    theme: localStorage.getItem('theme') || 'dark',
    customColor: localStorage.getItem('custom_color') || '#e63b2e'
  };

  function applyThemeSettings() {
    if (state.theme === 'light') {
      document.body.classList.add('light-theme');
    } else {
      document.body.classList.remove('light-theme');
    }
    if (state.customColor) {
      document.documentElement.style.setProperty('--red', state.customColor);
    }
  }

  const isLead = u => u && rankOf(u.rank).level >= LEAD_LEVEL;
  const isInnerLead = u => u && rankOf(u.rank).level >= INNER_LEAD_LEVEL;
  const isDirector = u => u && rankOf(u.rank).level >= DIRECTOR_LEVEL;
  const isMajorOrHigher = u => u && rankOf(u.rank).level >= MAJOR_LEVEL;

  function toast(msg, isErr = false) {
    const container = $('#toasts');
    if (!container) return;
    const t = document.createElement('div');
    t.className = 'toast' + (isErr ? ' err' : '');
    t.textContent = msg;
    container.append(t);
    setTimeout(() => t.remove(), 3200);
  }

  async function renderLogin() {
    const root = $('#root');
    if (!root) return;

    let loginUrl = '#';
    try {
      const res = await fetch('/api/auth/url');
      const data = await res.json();
      loginUrl = data.url;
    } catch(e) {}

    root.innerHTML = `
    <div class="login"><div class="login-card">
      <div class="login-top">
        <h1>HZS System</h1>
        <p>Pro přístup do výjezdového portálu se přihlaste svým Discord účtem.</p>
      </div>
      <div class="login-body">
        <a href="${loginUrl}" class="btn discord" style="justify-content:center; padding:12px; font-size:1.05rem;">
          Přihlásit se přes Discord
        </a>
        <div>
          <a href="${CONFIG.DISCORD_INVITE_LINK}" target="_blank" rel="noopener noreferrer" style="color:var(--amber); text-decoration:none; font-size:0.85rem;">
            Nemáš přístup? Připoj se na náš Discord server
          </a>
        </div>
      </div>
    </div></div>`;
  }

  async function syncDutyToDiscord() {
    const activeMembers = Data.members()
      .filter(m => m.onDuty)
      .map(m => ({ name: m.name, rankName: rankOf(m.rank).name }));

    try {
      await fetch('/api/duty-sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ activeMembers, editMessage: true })
      });
    } catch (e) {}
  }

  setInterval(() => {
    const now = new Date();
    const daysOfWeek = ['neděle', 'pondělí', 'úterý', 'středa', 'čtvrtek', 'pátek', 'sobota'];
    const dayName = daysOfWeek[now.getDay()];
    const dateFormatted = `${now.getDate()}. ${now.getMonth()+1}. ${now.getFullYear()}`;
    const timeFormatted = now.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    
    const realClockEl = $('#real-time-clock');
    if (realClockEl) {
      realClockEl.textContent = `${dayName} ${dateFormatted} – ${timeFormatted}`;
    }

    const u = state.user;
    if (!u) return;
    const dbUser = Data.member(u.id);
    const timerEl = $('#live-duty-timer');
    if (dbUser && dbUser.onDuty && dbUser.dutyStart) {
      const diffSec = Math.floor((Date.now() - dbUser.dutyStart) / 1000);
      const h = Math.floor(diffSec / 3600);
      const m = Math.floor((diffSec % 3600) / 60);
      const s = diffSec % 60;
      if (timerEl) {
        timerEl.textContent = `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      }
    } else {
      if (timerEl) timerEl.textContent = `0:00:00`;
    }
  }, 1000);

  function viewDashboard() {
    const u = state.user;
    const allIncidents = Data.incidents();
    const myIncidents = allIncidents.filter(i => isLead(u) || (i.memberIds && i.memberIds.includes(u.id)));
    const approvedInc = myIncidents.filter(i => i.status === 'approved');

    const dbUser = Data.member(u.id) || u;
    const activeSec = dbUser.onDuty && dbUser.dutyStart ? Math.floor((Date.now() - dbUser.dutyStart)/1000) : 0;
    const h = Math.floor(activeSec / 3600);
    const m = Math.floor((activeSec % 3600) / 60);
    const s = activeSec % 60;

    const announcements = Data.announcements();
    const daysOfWeek = ['neděle', 'pondělí', 'úterý', 'středa', 'čtvrtek', 'pátek', 'sobota'];
    const now = new Date();
    const dayName = daysOfWeek[now.getDay()];
    const initialRealTime = `${dayName} ${now.getDate()}. ${now.getMonth()+1}. ${now.getFullYear()} – ${now.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
    const activeDutyMembers = Data.members().filter(m => m.onDuty);

    const nowTime = now.getTime();
    const inc7Days = allIncidents.filter(i => !isNaN(new Date(i.datetime).getTime()) && (nowTime - new Date(i.datetime).getTime()) <= (7 * 24 * 60 * 60 * 1000));
    const inc30Days = allIncidents.filter(i => !isNaN(new Date(i.datetime).getTime()) && (nowTime - new Date(i.datetime).getTime()) <= (30 * 24 * 60 * 60 * 1000));

    return `
    <div class="page-head">
      <div>
        <h1>Dobrý den, ${esc(u.name)}</h1>
        <p>${esc(rankOf(dbUser.rank || u.rank).name)} · číslo ${esc(dbUser.number || '000')}</p>
      </div>
      <div style="display:flex; align-items:center; gap:24px; flex-wrap:wrap;">
        <div style="text-align:right;">
          <div class="muted" style="font-size:0.75rem; text-transform:uppercase;">Reálný čas</div>
          <div id="real-time-clock" style="font-family:var(--f-head); font-size:1.15rem; font-weight:600;">${initialRealTime}</div>
        </div>
        <div style="text-align:right;">
          <div class="muted" style="font-size:0.75rem; text-transform:uppercase;">Čas ve službě</div>
          <div id="live-duty-timer" style="font-family:var(--f-head); font-size:1.6rem; font-weight:700;">${dbUser.onDuty ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : '0:00:00'}</div>
        </div>
        <button class="btn ${dbUser.onDuty ? 'danger' : 'primary'}" data-act="toggle-duty">
          ${dbUser.onDuty ? 'Ukončit službu' : 'Nastoupit do služby'}
        </button>
      </div>
    </div>

    <div class="strip">
      <div><div class="n">${inc7Days.length}</div><div class="l">výjezdů za 7 dní</div></div>
      <div><div class="n">${inc30Days.length}</div><div class="l">výjezdů za 30 dní</div></div>
      <div><div class="n">${activeDutyMembers.length}</div><div class="l">členů ve službě</div></div>
      <div><div class="n">${approvedInc.length}</div><div class="l">tvých výjezdů celkem</div></div>
    </div>

    <div style="display:grid; grid-template-columns: 2fr 1fr; gap:20px;">
      <div>
        <div class="panel">
          <div class="panel-head"><h2>Poslední výjezdy</h2>${isLead(u) ? '<button class="btn primary sm" data-act="new-incident">+ Zapsat výjezd</button>' : ''}</div>
          <ul class="inc-list">
            ${myIncidents.slice(0, 6).map(i => `
              <li class="inc" data-act="open-incident-detail" data-id="${i.id}">
                <span class="bar ${TYPES[i.type] ? TYPES[i.type].cls : ''}"></span>
                <span><b>${esc(i.number)}</b> -${esc(TYPES[i.type] ? TYPES[i.type].name : i.type)}<br><small class="muted">${esc(i.location)}</small></span>
                <span class="right">${fmtDT(i.datetime)}<br><small class="muted">vel. ${esc(Data.member(i.commanderId)?.name || 'Neznámý')}</small></span>
              </li>`).join('') || '<li class="empty">Žádné výjezdy.</li>'}
          </ul>
        </div>
      </div>
      <div>
        <div class="panel">
          <div class="panel-head">
            <h2>Oznámení</h2>
            ${isLead(u) ? '<button class="btn primary sm" data-act="new-announcement">+ Přidat</button>' : ''}
          </div>
          <div class="panel-body">
            ${announcements.length ? announcements.map(a => `
              <div style="margin-bottom:12px; border-bottom:1px solid var(--line); padding-bottom:8px;">
                <b style="font-size:0.95rem;">${esc(a.title)}</b>
                <p style="font-size:0.9rem; margin:4px 0;">${esc(a.content)}</p>
                <div class="muted" style="font-size:0.75rem;">Přidal: ${esc(a.authorName)} (${fmtDT(a.createdAt)})</div>
              </div>
            `).join('') : '<p class="muted" style="text-align:center;">Žádná oznámení.</p>'}
          </div>
        </div>

        <div class="panel">
          <div class="panel-head"><h2>Ve službě</h2></div>
          <div class="panel-body" style="display:flex; flex-direction:column; gap:10px;">
            ${activeDutyMembers.length ? activeDutyMembers.map(m => `
              <div style="display:flex; align-items:center; gap:10px;">
                ${avatar(m)}
                <div>
                  <div style="font-weight:600; font-size:0.9rem;">${esc(m.name)}</div>
                  <div class="muted" style="font-size:0.75rem;">${esc(rankOf(m.rank).name)}</div>
                </div>
              </div>
            `).join('') : '<p class="muted" style="text-align:center;">Nikdo není ve službě.</p>'}
          </div>
        </div>
      </div>
    </div>`;
  }

    const list = Data.incidents();

    <div class="page-head">
      <div><h1>Výjezdy pro vedení</h1><p>Správa a přehled všech výjezdů</p></div>

      <tbody>

            </td>

              <td>
                <div style="display:flex; gap:6px;">
                  <button class="btn sm" data-act="edit-member" data-id="${m.id}">Upravit</button>
                  <button class="btn sm danger" data-act="confirm-delete-member" data-id="${m.id}">Smazat</button>
                </div>
              </td>` : ''}
          </tr>`).join('')}
      </tbody>
    </table></div></div>`;

  function viewBonuses() {
    const members = Data.members();
    return `
    <div class="page-head">
      <div><h1>Týdenní prémie členů</h1><p>Přehled od neděle do neděle (automatický reset v pondělí o půlnoci)</p></div>
    </div>
    <div class="panel"><div class="table-wrap"><table>
      <thead><tr><th>Člen</th><th>Hodnost</th><th>Záznamy prémií za tento týden</th><th>Celkem prémie</th></tr></thead>
      <tbody>
        ${members.map(m => {
          const bonuses = m.weeklyBonuses || {};
          const total = Object.values(bonuses).reduce((a, b) => a + b, 0);
          return `
            <tr>
              <td><div class="who">${avatar(m)}<b>${esc(m.name)}</b></div></td>
              <td>${esc(rankOf(m.rank).name)}</td>
              <td>
                ${Object.keys(bonuses).length ? Object.entries(bonuses).map(([incId, amount]) => {
                  const inc = Data.incidents().find(i => i.id === incId);
                  return `<div style="font-size:0.85rem; color:var(--muted);">• ${inc ? esc(inc.number) : 'Výjezd'}: <b style="color:var(--text);">${amount} €</b></div>`;
                }).join('') : '<span class="muted">Zatím žádné prémie</span>'}
              </td>
              <td><b style="color:var(--green); font-size:1.1rem;">${total} €</b></td>
            </tr>`;
        }).join('')}
      </tbody>
    </table></div></div>`;
  }

  function viewAdmin() {
    const pending = Data.incidents().filter(i => i.status === 'pending');
    return `
    <div class="page-head"><div><h1>Správa Vedení</h1></div></div>
    <div class="panel">
      <div class="panel-head"><h2>Výjezdy ke schválení (${pending.length})</h2></div>
      <ul class="inc-list">
        ${pending.map(i => `
          <li class="inc">
            <span><b>${esc(i.number)}</b> -${esc(i.location)}</span>
            <span><button class="btn sm ok" data-act="approve-inc" data-id="${i.id}">Schválit</button></span>
          </li>`).join('') || '<li class="empty">Žádné výjezdy nečekají na schválení.</li>'}
      </ul>
    </div>`;
  }

  function renderView() {
    const v = state.activeTab;
    const el = $('#view');
    if (!el) return;

    if (v === 'dashboard') el.innerHTML = viewDashboard();
    else if (v === 'incidents') el.innerHTML = viewIncidents();
    else if (v === 'guidelines') el.innerHTML = viewGuidelines();
    else if (v === 'members') el.innerHTML = viewMembers();
    else if (v === 'bonuses' && isMajorOrHigher(state.user)) el.innerHTML = viewBonuses();
    else if (v === 'admin' && isLead(state.user)) el.innerHTML = viewAdmin();
    else el.innerHTML = viewDashboard();
  }

  async function fetchDiscordMembers() {
    try {
      const res = await fetch('/api/members');
      if (res.ok) {
        const members = await res.json();
        Data.syncMembers(members);
      }
    } catch (e) {}
  }

  async function renderApp() {
    const u = state.user;
    if (!u) return renderLogin();

    await Data.fetchIncidentsFromApi();
    await fetchDiscordMembers();
    applyThemeSettings();

    const root = $('#root');

    root.innerHTML = `

            <div style="position:relative;">
              <button class="btn sm" data-act="toggle-color-picker" title="Vlastní barva">🎨 Barva</button>

            <div class="field"><label>Služební číslo</label><input type="text" id="m-num" value="${editM ? esc(editM.number) : ''}" required /></div>
            <div class="field full"><label>Hodnost</label>
              <select id="m-rank">${RANKS.map(r => `<option value="${r.key}" ${editM && editM.rank === r.key ? 'selected' : ''}>${r.name}</option>`).join('')}</select>
            </div>
          </form>
        </div>
        <div class="modal-foot">
          <button class="btn" data-act="close">Zrušit</button>
          <button class="btn primary" data-act="submit-member" data-id="${editM ? editM.id : ''}">Uložit</button>
        </div>
      </div>
    </div>`;
    document.body.insertAdjacentHTML('beforeend', html);
  }

  function handleLoginSuccess() {
    const hash = window.location.hash;
    if (hash.startsWith('#/login-success')) {
      const urlParams = new URLSearchParams(hash.split('?')[1]);
      const userRaw = urlParams.get('user');
      if (userRaw) {
        try {
          const user = JSON.parse(decodeURIComponent(userRaw));
          state.user = user;
          sessionStorage.setItem('logged_user', JSON.stringify(user));
          toast(`Vítej, ${user.name}!`);
        } catch(e) {}
      }
      window.location.hash = '#/dashboard';
    }
  }

  document.addEventListener('input', e => {
    if (e.target && e.target.id === 'color-picker') {
      state.customColor = e.target.value;
      localStorage.setItem('custom_color', state.customColor);
      applyThemeSettings();
    }
  });

  document.addEventListener('click', async e => {
    const el = e.target.closest('[data-act]');
    if (!el) {
      const popover = $('#color-picker-popover');
      if (popover && !e.target.closest('#color-picker-popover') && !e.target.closest('[data-act="toggle-color-picker"]')) {
        popover.style.display = 'none';
      }
      return;
    }
    const act = el.dataset.act;

    if (act === 'toggle-theme') {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', state.theme);
      renderApp();
    }
    if (act === 'toggle-color-picker') {
      const popover = $('#color-picker-popover');
      if (popover) {
        popover.style.display = popover.style.display === 'flex' ? 'none' : 'flex';
      }
    }
    if (act === 'reset-color') {
      state.customColor = '#e63b2e';
      localStorage.setItem('custom_color', state.customColor);
      applyThemeSettings();
      const picker = $('#color-picker');
      if (picker) picker.value = '#e63b2e';
      toast('Barva resetována do výchozího stavu.');
    }
    if (act === 'logout') {
      state.user = null;
      sessionStorage.removeItem('logged_user');
      window.location.hash = '';
      renderLogin();
    }
    if (act === 'toggle-duty') {
      let u = Data.member(state.user.id) || state.user;
      u.onDuty = !u.onDuty;
      if (u.onDuty) {
        u.dutyStart = Date.now();
        toast('Nastoupil jsi do služby.');
      } else {
        if (u.dutyStart) {
          const diff = Math.floor((Date.now() - u.dutyStart) / 1000);
          const durMin = Math.floor(diff / 60);
          const durSec = diff % 60;
          const dutyRecordStr = `${durMin}m ${durSec}s (${new Date().toLocaleDateString('cs-CZ')})`;
          if (!u.dutiesHistory) u.dutiesHistory = [];
          u.dutiesHistory.unshift(dutyRecordStr);
          u.dutyStart = null;
        }
        toast('Služba ukončena a uložena na profil.');
      }
      Data.saveMember(u);
      await syncDutyToDiscord();
      renderApp();
    }
    if (act === 'new-incident') openNewIncidentModal();
    if (act === 'open-incident-detail') openIncidentDetailModal(el.dataset.id);
    if (act === 'edit-incident') {
      const inc = Data.incidents().find(x => x.id === el.dataset.id);
      if (inc) openNewIncidentModal(inc);
    }
    if (act === 'confirm-delete-incident') {
      openConfirmModal('Smazat výjezd', 'Opravdu smazat tento výjezd?', async () => {
        await Data.deleteIncident(el.dataset.id);
        toast('Výjezd smazán.');
        renderApp();
      });
    }
    if (act === 'new-guideline') openGuidelineModal();
    if (act === 'edit-guideline') {
      const g = Data.guidelines().find(x => x.id === el.dataset.id);
      if (g) openGuidelineModal(g);
    }
    if (act === 'confirm-delete-guideline') {
      openConfirmModal('Smazat směrnici', 'Opravdu chcete smazat tuto směrnici?', () => {
        Data.deleteGuideline(el.dataset.id);
        toast('Směrnice smazána.');
        renderApp();
      });
    }
    if (act === 'new-announcement') openAnnouncementModal();
    if (act === 'manual-add-member') openMemberModal();
    if (act === 'edit-member') {
      const m = Data.member(el.dataset.id);
      if (m) openMemberModal(m);
    }
    if (act === 'confirm-delete-member') {
      openConfirmModal('Odebrat člena', 'Opravdu chcete tohoto člena odebrat?', () => {
        Data.deleteMember(el.dataset.id);
        toast('Člen odebrán.');
        renderApp();
      });
    }
    if (act === 'confirm-delete-duty-history') {
      const mId = el.dataset.memberId;
      const dIdx = parseInt(el.dataset.dutyIdx, 10);
      openConfirmModal('Smazat záznam', 'Opravdu smazat tento záznam služby?', () => {
        const m = Data.member(mId);
        if (m && m.dutiesHistory) {
          m.dutiesHistory.splice(dIdx, 1);
          Data.saveMember(m);
          toast('Záznam služby smazán.');
          renderApp();
        }
      });
    }
    if (act === 'close') closeModal();
    if (act === 'submit-inc') {
      const editId = el.dataset.id;
      const loc = $('#i-loc')?.value;
      const desc = $('#i-desc')?.value;
      const type = $('#i-type')?.value;
      const selectedMembers = Array.from(document.querySelectorAll('input[name="m-check"]:checked')).map(cb => cb.value);

      if (!loc || !desc) return toast('Vyplň všechna pole.', true);

      const existingInc = editId ? Data.incidents().find(x => x.id === editId) : null;
      const inc = {
        id: editId || uid(),
        number: existingInc ? existingInc.number : `VYJ-2026-000${Data.incidents().length + 1}`,
        datetime: existingInc ? existingInc.datetime : new Date().toISOString(),
        type, location: loc,
        units: ['CAS 20'],
        memberIds: selectedMembers.length ? selectedMembers : [state.user.id],
        commanderId: state.user.id,
        description: desc,
        result: 'V řešení',
        status: isLead(state.user) ? 'approved' : 'pending',
        authorId: state.user.id
      };

      await Data.saveIncident(inc);
      closeModal();
      toast('Výjezd úspěšně uložen.');
      renderApp();
    }
    if (act === 'submit-guideline') {
      const editId = el.dataset.id;
      const title = $('#g-title')?.value;
      const category = $('#g-cat')?.value;
      const content = $('#g-content')?.value;
      if (!title || !content) return toast('Vyplň všechna pole.', true);

      const g = {
        id: editId || uid(),
        title, category, content,
        date: new Date().toISOString()
      };
      Data.saveGuideline(g);
      closeModal();
      toast('Směrnice uložena.');
      renderApp();
    }
    if (act === 'submit-announcement') {
      const title = $('#a-title')?.value;
      const content = $('#a-content')?.value;
      if (!title || !content) return toast('Vyplň všechna pole.', true);

      const a = {
        id: uid(),
        title, content,
        authorName: state.user.name,
        createdAt: new Date().toISOString()
      };
      Data.saveAnnouncement(a);
      closeModal();
      toast('Oznámení publikováno.');
      renderApp();
    }
    if (act === 'submit-member') {
      const editId = el.dataset.id;
      const name = $('#m-name')?.value;
      const number = $('#m-num')?.value;
      const rank = $('#m-rank')?.value;
      if (!name || !number) return toast('Vyplň jméno i číslo.', true);

      const existing = editId ? Data.member(editId) : null;
      const m = {
        id: editId || uid(),
        name, number, rank,
        onDuty: existing ? existing.onDuty : false,
        totalDutySeconds: existing ? existing.totalDutySeconds : 0,
        dutiesHistory: existing ? (existing.dutiesHistory || []) : [],
        weeklyBonuses: existing ? (existing.weeklyBonuses || {}) : {}
      };
      Data.saveMember(m);
      closeModal();
      toast('Člen uložen.');
      renderApp();
    }
    if (act === 'approve-inc') {
      const inc = Data.incidents().find(i => i.id === el.dataset.id);
      if (inc) {
        inc.status = 'approved';
        await Data.saveIncident(inc);
        toast('Výjezd schválen.');
        renderApp();
      }
    }
  });

  window.addEventListener('hashchange', () => {
    handleLoginSuccess();
    const hash = window.location.hash;
    if (hash && !hash.startsWith('#/login-success')) {
      state.activeTab = hash.replace('#/', '');
      localStorage.setItem('active_tab', state.activeTab);
    }
    renderApp();
  });

  if (state.user && !window.location.hash) {
    window.location.hash = `#/${state.activeTab}`;
  }

  handleLoginSuccess();
  renderApp();
  // ]]>
  </script>
</body>
</html>
